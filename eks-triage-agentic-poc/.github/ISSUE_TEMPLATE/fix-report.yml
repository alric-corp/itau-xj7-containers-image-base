name: "[FIX] Fix Report"
description: "Abra um registro de correção de um problema que possui contorno, mas cuja correção ainda é necessária"
title: "[FIX] "
labels: ["type: fix", "waiting-for-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reservar um tempo para preencher este registro de fix (correção)!
        Não inclua credenciais, tokens, segredos ou logs sem sanitização.

  - type: input
    id: comunidade
    attributes:
      label: Comunidade
      description: Informe sua comunidade ou a que está sendo afetada
      placeholder: ex. Cloud
    validations:
      required: false

  - type: textarea
    id: oqueaconteceu
    attributes:
      label: O que aconteceu?
      description: Resumo da correção necessária e do contorno existente
      placeholder: Conte-nos sobre a correção sugerida, o contorno, cenário, logs sanitizados, mensagens de erro e como reproduzir
      value: "Sobre a sugestão da correção ou problema"
    validations:
      required: true

  - type: input
    id: eksversion
    attributes:
      label: Versão EKS
      description: Versão do cluster utilizado onde necessita uma correção
      placeholder: ex. 1.31
    validations:
      required: true

  - type: input
    id: tagversion
    attributes:
      label: Versão TAG
      description: Versão do código inner-source utilizado onde necessita uma correção
      placeholder: ex. 8.2.0
    validations:
      required: true

  - type: input
    id: conta
    attributes:
      label: ID da Conta AWS
      description: Para esta POC, utilize somente um valor fictício
      placeholder: ex. 000000000000
    validations:
      required: true

  - type: input
    id: gitrepo
    attributes:
      label: Repositório GIT
      description: Repositório com o código consumidor utilizado onde necessita uma correção
      placeholder: ex. https://github.com/SUA_ORG/exemplo-eks
    validations:
      required: true

  - type: input
    id: clustername
    attributes:
      label: Nome do Cluster
      description: Para esta POC, utilize somente um nome fictício
      placeholder: ex. cluster-demo
    validations:
      required: true

  - type: textarea
    id: information
    attributes:
      label: Mais informações
      description: Adicione mais informações importantes sobre a correção solicitada

  - type: checkboxes
    id: terms
    attributes:
      label: Informações úteis para abertura de um Fix Report
      description: Antes de submeter, leia as dicas de como abrir um fix
      options:
        - label: Eu li as dicas e concordo em ajudar com mais informações
          required: true
