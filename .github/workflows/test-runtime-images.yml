name: Test candidate runtime images

on:
  workflow_call:
    inputs:
      framework:
        type: string
        required: true
      artifact-run-id:
        description: 'Run containing validated-oci artifacts; empty means the caller run.'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      framework:
        type: choice
        required: true
        options: [nodejs22, nodejs24, nodejs22-dev, nodejs24-dev, python3-13, python3-14]
      artifact-run-id:
        description: 'Run containing the validated-oci artifact in this repository.'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    uses: alric-corp/itau-xj7-reusable-workflows/.github/workflows/test-runtime-images.yml@8f82ea345b38142d43fb8f8358ae76d2d4ea97ce
    with:
      framework: ${{ inputs.framework }}
      artifact-run-id: ${{ inputs.artifact-run-id }}
