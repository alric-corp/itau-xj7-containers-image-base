name: Test candidate runtime images

on:
  workflow_call:
    inputs:
      framework:
        type: string
        required: true
      artifact-run-id:
        description: 'Run containing validated-oci artifacts; empty means the caller run.'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      framework:
        type: choice
        required: true
        options: [nodejs22, nodejs24, nodejs22-dev, nodejs24-dev, python3-13, python3-14,
                  go1-26, java21, dotnet10]
      artifact-run-id:
        description: 'Run containing the validated-oci artifact in this repository.'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    uses: alric-corp/itau-xj7-reusable-workflows/.github/workflows/test-runtime-images.yml@081270ccf18ee4d98da23f22f761846d29f71486 # reviewed shared workflows
    with:
      framework: ${{ inputs.framework }}
      artifact-run-id: ${{ inputs.artifact-run-id }}
