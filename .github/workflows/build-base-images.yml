name: Build & Push Base Images (reusable)

on:
  workflow_call:
    inputs:
      aws-region:
        description: "Região AWS do ECR (ex.: us-east-1)"
        type: string
        required: true
      aws-role-arn:
        description: "Role assumida via OIDC com permissão de push no ECR"
        type: string
        required: true
      frameworks:
        description: "JSON array de frameworks a buildar (deve casar com um arquivo em frameworks/<nome>.yaml)."
        type: string
        required: true

permissions:
  id-token: write           # obrigatório para o OIDC assumir a role AWS e para o cosign keyless (Sigstore)
  contents: read
  attestations: write       # obrigatório para actions/attest-build-provenance
  artifact-metadata: write  # storage record da attestation (evita o warning "Failed to persist storage record")

env:
  SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:b9ca6a549aa71990d50ab390a8bddf606a6689379026aa24e7f4f70b5a43fbcd

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/validate-base-images.yml
    with:
      frameworks: ${{ inputs.frameworks }}

  build-push:
    name: Build & push ${{ matrix.framework }}
    # M13: `needs: validate` sozinho pularia TODA a matriz de publicação se
    # QUALQUER framework falhasse a validação (dotnet8 falha o scan há
    # tempos, por exemplo) — needs trata o job `validate` (com sua própria
    # matriz interna) como um resultado agregado, não por framework.
    # `if: always()` evita esse skip em massa; o isolamento por framework de
    # verdade acontece no passo "Download validated OCI artifact" abaixo —
    # cada leg da matriz só publica se o SEU PRÓPRIO artifact aprovado
    # existir. Não é `continue-on-error` no scan (o scan de cada framework
    # continua falhando normalmente, dentro do job `validate`) nem
    # `if: always()` sozinho sem a checagem — a falha de validação de um
    # framework continua visível e sem publicação, só não derruba os outros
    # frameworks do lote.
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    # Observado: 32-110s por framework num run real de 11 frameworks (M14);
    # dotnet10 (maior artifact) foi o mais lento. Margem cobre variância de
    # rede nas chamadas AWS/ECR/cosign/Sigstore.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(inputs.frameworks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download validated OCI artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validated-oci-${{ matrix.framework }}
          path: image.oci

      # Framework isolado: sem o artifact aprovado (validate falhou pra
      # ESTE framework especificamente, ou nunca rodou por falha na
      # dependência comum do bundle), esta leg falha aqui — visível, sem
      # publicação — sem afetar as legs de outros frameworks cujo artifact
      # foi aprovado normalmente.
      - name: Require validated artifact
        if: steps.download.outcome == 'failure'
        run: |
          echo "::error::Nenhum artifact validado para ${{ matrix.framework }} — validação falhou ou não rodou (ver job 'validate'). Publicação abortada para este framework." >&2
          exit 1

      - name: Verify artifact integrity and platforms
        id: verified
        run: |
          set -eu
          DIGEST=$(python3 -B .github/scripts/oci_artifact.py verify image.oci)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify pinned Skopeo is available
        run: |
          set -euo pipefail
          docker run --rm --pull=always "$SKOPEO_IMAGE" --version | tee skopeo-version.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # ECR não cria repositório automaticamente no primeiro push (diferente
      # do Docker Hub) — garante que ele existe antes do apko publicar.
      - name: Ensure ECR repository exists
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          set -eu
          REPO="image-base-${FRAMEWORK}"
          if ! aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>ecr-error.txt; then
            if ! grep -q 'RepositoryNotFoundException' ecr-error.txt; then
              cat ecr-error.txt >&2
              exit 1
            fi
            aws ecr create-repository \
              --repository-name "$REPO" \
              --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
              --image-tag-mutability-exclusion-filters filterType=WILDCARD,filter=stable \
              --image-scanning-configuration scanOnPush=true >/dev/null
          fi
          aws ecr put-image-tag-mutability --repository-name "$REPO" \
            --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
            --image-tag-mutability-exclusion-filters filterType=WILDCARD,filter=stable >/dev/null

      # Referência da imagem: <registry-ecr>/image-base-<framework>, com uma
      # tag imutável <ddmmaa-hhmm> (GMT-3 / America/Sao_Paulo). A tag "stable"
      # NÃO é publicada aqui — ela só é promovida pelo workflow
      # promote-stable.yml, depois de uma janela de soak sem novas CVEs
      # (ver "Gate de promoção" no README).
      - name: Set image name and tags
        env:
          FRAMEWORK: ${{ matrix.framework }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -eu
          echo "IMAGE_NAME=${REGISTRY}/image-base-${FRAMEWORK}" >> "$GITHUB_ENV"
          echo "TIMESTAMP_TAG=$(TZ='America/Sao_Paulo' date +%d%m%y-%H%M)-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      # Copia os mesmos manifests e layers validados; nenhuma resolução de pacotes.
      - name: Publish validated OCI artifact (multi-arch)
        id: publish
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EXPECTED: ${{ steps.verified.outputs.digest }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/skopeo-auth"
          trap 'rm -f "$RUNNER_TEMP/skopeo-auth/config.json"' EXIT
          aws ecr get-login-password | docker run --rm -i \
            -v "$RUNNER_TEMP/skopeo-auth":/auth "$SKOPEO_IMAGE" \
            login --authfile /auth/config.json --username AWS --password-stdin "$REGISTRY"
          docker run --rm -v "$PWD":/work -w /work \
            -v "$RUNNER_TEMP/skopeo-auth/config.json":/auth/config.json:ro "$SKOPEO_IMAGE" \
            copy --all --preserve-digests --authfile /auth/config.json \
            --digestfile /work/published.digest \
            oci:/work/image.oci:image "docker://${IMAGE_NAME}:${TIMESTAMP_TAG}"
          ACTUAL=$(cat published.digest)
          test "$EXPECTED" = "$ACTUAL"
          # Leia a tag publicada de volta: prova independente do digestfile.
          docker run --rm \
            -v "$RUNNER_TEMP/skopeo-auth/config.json":/auth/config.json:ro "$SKOPEO_IMAGE" \
            inspect --raw --authfile /auth/config.json \
            "docker://${IMAGE_NAME}:${TIMESTAMP_TAG}" > published-index.json
          python3 -B .github/scripts/verify_publication.py \
            image.oci/validated-index.json published.digest published-index.json \
            "${IMAGE_NAME}@${ACTUAL}" > publication-evidence.json
          echo "image_ref=${IMAGE_NAME}@${ACTUAL}" >> "$GITHUB_OUTPUT"
          echo "digest=${ACTUAL}" >> "$GITHUB_OUTPUT"

      # Verificabilidade (padrão hardened, ver RFC-013 Fase 3): assina o
      # digest publicado com cosign keyless — usa o mesmo token OIDC do job
      # (audience Sigstore/Fulcio, não o da AWS), sem chave privada pra
      # gerenciar. A assinatura fica registrada no transparency log público
      # do Rekor e anexada ao próprio repositório ECR como um artefato OCI
      # adicional (tag "sha256-<digest>.sig" se o ECR ainda não suportar a
      # OCI Referrers API nesta região).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published image (keyless)
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          set -eu
          cosign sign --yes "${IMAGE_REF}"

      # Build provenance (SLSA) nativo do GitHub Actions: registra como,
      # onde (este workflow/run) e a partir de qual commit a imagem foi
      # construída. Fica disponível via `gh attestation verify` e, com
      # push-to-registry, também como artefato anexado no ECR.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Preserve publication evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-${{ matrix.framework }}-${{ github.run_attempt }}
          path: |
            image.oci/validated-index.json
            published.digest
            published-index.json
            publication-evidence.json
            skopeo-version.txt
          retention-days: 30
          if-no-files-found: warn
