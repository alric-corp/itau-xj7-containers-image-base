name: Build & Push Base Images (reusable)

on:
  workflow_call:
    inputs:
      aws-region:
        description: "Região AWS do ECR (ex.: us-east-1)"
        type: string
        required: true
      aws-role-arn:
        description: "Role assumida via OIDC com permissão de push no ECR"
        type: string
        required: true
      frameworks:
        description: "JSON array de frameworks a buildar (deve casar com um arquivo em frameworks/<nome>.yaml)."
        type: string
        required: true

permissions:
  id-token: write           # obrigatório para o OIDC assumir a role AWS e para o cosign keyless (Sigstore)
  contents: read
  attestations: write       # obrigatório para actions/attest-build-provenance
  artifact-metadata: write  # storage record da attestation (evita o warning "Failed to persist storage record")

env:
  # Fixação por digest e atualização controlada permanecem no item M09.
  APKO_IMAGE: cgr.dev/chainguard/apko:latest

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/validate-base-images.yml
    with:
      frameworks: ${{ inputs.frameworks }}

  build-push:
    name: Build & push ${{ matrix.framework }}
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(inputs.frameworks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR não cria repositório automaticamente no primeiro push (diferente
      # do Docker Hub) — garante que ele existe antes do apko publicar.
      - name: Ensure ECR repository exists
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          set -eu
          REPO="image-base-${FRAMEWORK}"
          aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$REPO" \
              --image-tag-mutability MUTABLE \
              --image-scanning-configuration scanOnPush=true >/dev/null

      # apko é extraído como binário nativo (em vez de rodar via `docker run`)
      # para reaproveitar as credenciais que o passo de login no ECR já
      # escreveu em ~/.docker/config.json, sem precisar montar volume para
      # simular o $HOME de um container. APKO_IMAGE (":latest" por padrão,
      # ver env do workflow) mantém sempre a última versão estável do apko.
      - name: Install apko (latest stable)
        run: |
          set -eu
          docker create --name apko-extract "$APKO_IMAGE"
          docker cp apko-extract:/usr/bin/apko ./apko
          docker rm apko-extract
          chmod +x ./apko
          ./apko version

      - name: Download melange repository
        uses: actions/download-artifact@v8
        with:
          name: melange-repo
          path: melange-repo

      # Referência da imagem: <registry-ecr>/image-base-<framework>, com uma
      # tag imutável <ddmmaa-hhmm> (GMT-3 / America/Sao_Paulo). A tag "stable"
      # NÃO é publicada aqui — ela só é promovida pelo workflow
      # promote-stable.yml, depois de uma janela de soak sem novas CVEs
      # (ver "Gate de promoção" no README).
      - name: Set image name and tags
        env:
          FRAMEWORK: ${{ matrix.framework }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -eu
          echo "IMAGE_NAME=${REGISTRY}/image-base-${FRAMEWORK}" >> "$GITHUB_ENV"
          echo "TIMESTAMP_TAG=$(TZ='America/Sao_Paulo' date +%d%m%y-%H%M)" >> "$GITHUB_ENV"

      # M02 pendente: publish ainda reconstrói; não há comparação de digests.
      # Só chega aqui se a validação de todos os frameworks passou. Publica SÓ a tag imutável —
      # "stable" não é tocada aqui, ela é promovida separadamente pelo
      # workflow promote-stable.yml depois da janela de soak.
      #
      # apko publish escreve a referência completa da imagem publicada
      # (registro/repo@sha256:...) na última linha do stdout — não só o
      # digest sozinho (confirmado num run real). Guardamos os dois: a
      # referência completa (pra cosign) e só o digest depois do "@" (pra
      # attest-build-provenance, que quer subject-name e subject-digest
      # separados).
      - name: Publish immutable image (multi-arch)
        id: publish
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          set -eu
          IMAGE_REF=$(./apko publish \
            --arch x86_64,aarch64 \
            --repository-append melange-repo/packages \
            --keyring-append melange-repo/melange.rsa.pub \
            "frameworks/${FRAMEWORK}.yaml" \
            "${IMAGE_NAME}:${TIMESTAMP_TAG}" | tail -n1)
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "digest=${IMAGE_REF#*@}" >> "$GITHUB_OUTPUT"

      # Verificabilidade (padrão hardened, ver RFC-013 Fase 3): assina o
      # digest publicado com cosign keyless — usa o mesmo token OIDC do job
      # (audience Sigstore/Fulcio, não o da AWS), sem chave privada pra
      # gerenciar. A assinatura fica registrada no transparency log público
      # do Rekor e anexada ao próprio repositório ECR como um artefato OCI
      # adicional (tag "sha256-<digest>.sig" se o ECR ainda não suportar a
      # OCI Referrers API nesta região).
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign published image (keyless)
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          set -eu
          cosign sign --yes "${IMAGE_REF}"

      # Build provenance (SLSA) nativo do GitHub Actions: registra como,
      # onde (este workflow/run) e a partir de qual commit a imagem foi
      # construída. Fica disponível via `gh attestation verify` e, com
      # push-to-registry, também como artefato anexado no ECR.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
