name: Build & Push Multi-Arch Distroless Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  schedule:
    - cron: "0 3 * * *"   # build diário: 00:00 America/Sao_Paulo (03:00 UTC)
    - cron: "0 9 * * *"   # promoção diária: 06:00 America/Sao_Paulo (09:00 UTC) — soak de ~6h após o build
  workflow_dispatch:
    inputs:
      frameworks:
        description: 'JSON array de frameworks para build manual (ex.: ["go1-26"])'
        type: string
        default: '["go1-26"]'

# Reusable workflows chamados abaixo (build-base-images.yml, promote-stable.yml)
# pedem id-token/attestations write — a permissão efetiva de um workflow_call
# fica limitada ao que o CALLER concede aqui, então precisa espelhar (ou ser
# superset do que cada um pede, senão o run falha com "startup_failure"
# antes mesmo de criar jobs.
permissions:
  id-token: write
  contents: read
  attestations: write

# TODO: restaurar a lista completa de frameworks (os 12) nos dois `with:`
# abaixo assim que o teste real com go1-26 fechar de ponta a ponta (build +
# assinatura + attestation no ECR). Reduzido de propósito enquanto iteramos
# no fix do pipeline, pra não disparar os 12 builds em paralelo a cada push.
jobs:
  build-base-images:
    if: github.event.schedule != '0 9 * * *'
    uses: ./.github/workflows/build-base-images.yml
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      frameworks: ${{ github.event_name == 'workflow_dispatch' && inputs.frameworks || '["go1-26"]' }}

  promote-stable:
    if: github.event.schedule == '0 9 * * *'
    uses: ./.github/workflows/promote-stable.yml
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      soak-hours: 6
      frameworks: '["go1-26"]'
