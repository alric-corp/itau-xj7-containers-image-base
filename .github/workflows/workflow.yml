name: Build & Push Multi-Arch Distroless Image

on:
  # Allow-list (em vez de paths-ignore): só dispara pra mudanças que
  # realmente afetam a imagem publicada. paths-ignore com só "**.md" tinha
  # um buraco — qualquer outro arquivo não-.md (ex.: cve-triage.lock.yml,
  # que é .yml) disparava o build inteiro das 12 imagens sem necessidade.
  push:
    branches: [main]
    paths:
      - 'frameworks/**'
      - 'distroless/**'
      - 'melange/**'
      - '.github/workflows/workflow.yml'
      - '.github/workflows/build-base-images.yml'
      - '.github/workflows/validate-base-images.yml'
      - '.github/workflows/test-runtime-images.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'policies/**'
      - '.github/workflows/promote-stable.yml'
      # O contrato funcional é gate de publicação (M08/M10): mudar um projeto
      # mínimo ou um probe muda o que autoriza publicar.
      - 'tests/runtime/**'
      - 'Makefile'
  pull_request:
    paths:
      - 'frameworks/**'
      - 'distroless/**'
      - 'melange/**'
      - '.github/workflows/workflow.yml'
      - '.github/workflows/build-base-images.yml'
      - '.github/workflows/validate-base-images.yml'
      - '.github/workflows/test-runtime-images.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'policies/**'
      - '.github/workflows/promote-stable.yml'
      # O contrato funcional é gate de publicação (M08/M10): mudar um projeto
      # mínimo ou um probe muda o que autoriza publicar.
      - 'tests/runtime/**'
      - 'Makefile'
  schedule:
    - cron: "0 3 * * *"   # build diário: 00:00 America/Sao_Paulo (03:00 UTC)
    - cron: "17 * * * *"  # promoção horária; soak mínimo contado desde o push
  workflow_dispatch:
    inputs:
      frameworks:
        description: 'JSON array de frameworks para build manual (ex.: ["go1-26"])'
        type: string
        default: '["go1-26"]'

# PRs recebem apenas leitura. Escrita/OIDC são concedidos nos jobs autorizados.
permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    # M14: um novo commit no mesmo PR cancela a validação obsoleta (apko +
    # Trivy, sem AWS) em vez de rodar as duas até o fim; PRs diferentes têm
    # grupos diferentes e não se cancelam. Grupo próprio, nunca compartilhado
    # com build-base-images/promote-stable abaixo — esses nunca podem ser
    # cancelados por um PR/build novo.
    concurrency:
      group: validate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/validate-base-images.yml
    with:
      frameworks: '["java21", "java21-dev", "java25", "python3-13", "python3-14", "go1-25", "go1-26", "go1-26-dev", "nodejs22", "nodejs24", "nodejs22-dev", "nodejs24-dev", "dotnet8", "dotnet10", "dotnet10-dev"]'

  build-base-images:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *')
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build-base-images.yml
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      frameworks: ${{ github.event_name == 'workflow_dispatch' && inputs.frameworks || '["java21", "java21-dev", "java25", "python3-13", "python3-14", "go1-25", "go1-26", "go1-26-dev", "nodejs22", "nodejs24", "nodejs22-dev", "nodejs24-dev", "dotnet8", "dotnet10", "dotnet10-dev"]' }}

  promote-stable:
    if: github.ref == 'refs/heads/main' && github.event.schedule == '17 * * * *'
    permissions:
      contents: read
      id-token: write
      attestations: read
    uses: ./.github/workflows/promote-stable.yml
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      soak-hours: 6
      frameworks: '["java21", "java21-dev", "java25", "python3-13", "python3-14", "go1-25", "go1-26", "go1-26-dev", "nodejs22", "nodejs24", "nodejs22-dev", "nodejs24-dev", "dotnet8", "dotnet10", "dotnet10-dev"]'
# no-op, testing M14 cancel-in-progress
