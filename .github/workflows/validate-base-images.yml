# Product entry point. Executors live in the versioned reusable-workflow repository.
name: Validate base images (reusable, no AWS)
on:
  workflow_call:
    inputs:
      frameworks:
        description: "JSON array de frameworks a validar."
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    uses: alric-corp/alric-containers-reusable-workflows/.github/workflows/validate-apko-images.yml@0459275b4a2ffbe6e8961041e7b93b41e88ba215 # reviewed shared workflows
    with:
      frameworks: ${{ inputs.frameworks }}
