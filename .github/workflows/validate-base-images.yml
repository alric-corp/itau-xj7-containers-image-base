# Product entry point. Executors live in the versioned reusable-workflow repository.
name: Validate base images (reusable, no AWS)
on:
  workflow_call:
    inputs:
      frameworks:
        description: "JSON array de frameworks a validar."
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    uses: alric-corp/itau-xj7-reusable-workflows/.github/workflows/validate-apko-images.yml@081270ccf18ee4d98da23f22f761846d29f71486 # reviewed shared workflows
    with:
      frameworks: ${{ inputs.frameworks }}
