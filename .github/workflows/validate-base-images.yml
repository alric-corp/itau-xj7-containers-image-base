# Product entry point. Executors live in the versioned reusable-workflow repository.
name: Validate base images (reusable, no AWS)
on:
  workflow_call:
    inputs:
      frameworks:
        description: "JSON array de frameworks a validar."
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    uses: alric-corp/itau-xj7-reusable-workflows/.github/workflows/validate-apko-images.yml@8f82ea345b38142d43fb8f8358ae76d2d4ea97ce
    with:
      frameworks: ${{ inputs.frameworks }}
