# Gate rápido e obrigatório (M12): testes Python + actionlint em toda
# mudança, sem filtro de path. Um required check com filtro de path
# nunca dispara pra PR fora do escopo do filtro, e fica "pendente" pra
# sempre em vez de aprovar — por isso este workflow roda sempre (é
# rápido: segundos, não os minutos de melange/apko/Trivy do pipeline
# principal) e um PR só de documentação recebe resultado definido
# (sucesso) em vez de check obrigatório travado.
name: Fast checks (tests + actionlint)

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# M14: um novo commit no mesmo PR cancela a validação obsoleta em vez de
# rodar as duas até o fim; PRs diferentes (números diferentes) não se
# cancelam entre si, já que cada um tem seu próprio grupo. Só afeta este
# gate sem AWS — nunca compartilhado com os grupos de build-push/promote,
# que não podem ser cancelados por um PR/build novo (ver promote-stable.yml).
concurrency:
  group: fast-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Observado: ~24s num run real (M14).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test image pipeline scripts
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Test certificate verification without AWS
        run: python3 -B -m unittest discover -s tests/certificates -p 'test_*.py' -v

  lint-workflows:
    runs-on: ubuntu-latest
    # Observado: ~5s num run real (M14).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # cve-triage.lock.yml é gerado pelo `gh aw compile` a partir de
      # cve-triage.md — não faz parte deste lint (não editamos o lock à
      # mão pra satisfazer o linter). Os workflows abaixo são os únicos
      # escritos e mantidos diretamente neste repositório.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color \
            .github/workflows/build-base-images.yml \
            .github/workflows/validate-base-images.yml \
            .github/workflows/promote-stable.yml \
            .github/workflows/workflow.yml \
            .github/workflows/test-promotion.yml
