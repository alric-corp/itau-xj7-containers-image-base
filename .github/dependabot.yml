version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Runtime pins must be updated by the matching gh-aw compiler.
    ignore:
      - dependency-name: "github/gh-aw-actions/*"
    groups:
      reusable-container-pipeline:
        patterns:
          - "alric-corp/alric-containers-reusable-workflows*"
