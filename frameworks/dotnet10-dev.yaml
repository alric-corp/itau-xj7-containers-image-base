# Variante "dev": usada só no estágio de build (multi-stage) da aplicação,
# para `dotnet publish`. Nunca deve ser a imagem final publicada em
# produção — para isso use dotnet10.yaml (runtime ASP.NET, sem o SDK).
#
# busybox entra pelo mesmo motivo do nodejs-dev: sem shell, um `RUN
# dotnet publish ...` normal (shell-form) num Dockerfile falha com
# "/bin/sh: no such file or directory".
include: distroless/runtime.yaml
contents:
  packages:
    - dotnet-10-sdk
    - busybox
