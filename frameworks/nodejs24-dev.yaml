# Variante "dev": usada só no estágio de build (multi-stage) da aplicação,
# para rodar `npm install`/`npm ci`. Nunca deve ser a imagem final publicada
# em produção — para isso use nodejs24.yaml (sem npm/busybox/shell).
include: distroless/image-base.yaml
contents:
  packages:
    - nodejs-24
    - npm
    # npm's scripts start with `#!/usr/bin/env node`; busybox provides
    # /usr/bin/env, otherwise npm fails with "bad interpreter".
    - busybox

work-dir: /app

accounts:
  groups:
    - groupname: appuser
      gid: 10000
  users:
    - username: appuser
      uid: 10000
      gid: 10000
  run-as: appuser

paths:
  - path: /app
    type: directory
    uid: 10000
    gid: 10000
    permissions: 0o755
