# Variante "run": openjdk-25-jre (JRE), sem javac/jmods/javadoc/demos —
# sem compilador. Compile em java25-dev.yaml (estágio de build) e copie o
# JAR/classes para esta imagem no estágio final.
include: distroless/java.yaml
contents:
  packages:
    - openjdk-25-jre

environment:
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/jvm/java-25-openjdk/bin
