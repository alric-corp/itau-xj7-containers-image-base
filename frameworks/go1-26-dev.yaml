# Variante "dev": usada só no estágio de build (multi-stage) da aplicação,
# pra compilar o binário estático. Nunca deve ser a imagem final publicada
# em produção — para isso use go1-26.yaml (sem o toolchain do Go).
#
# busybox entra pelo mesmo motivo do nodejs-dev: sem shell, um `RUN go
# build ...` normal (shell-form) num Dockerfile falha com "/bin/sh: no
# such file or directory" — só a forma exec (`RUN ["go", "build", ...]`)
# funcionaria sem isso, o que não é o padrão esperado de um Dockerfile.
include: distroless/runtime.yaml
contents:
  packages:
    - go-1.26
    - busybox
