# Variante "dev": usada só no estágio de build (multi-stage) da aplicação,
# pra compilar o binário estático. Nunca deve ser a imagem final publicada
# em produção — para isso use go1-26.yaml (sem o toolchain do Go).
include: distroless/image-base.yaml
contents:
  packages:
    - go-1.26

work-dir: /app

accounts:
  groups:
    - groupname: appuser
      gid: 10000
  users:
    - username: appuser
      uid: 10000
      gid: 10000
  run-as: appuser

paths:
  - path: /app
    type: directory
    uid: 10000
    gid: 10000
    permissions: 0o755
