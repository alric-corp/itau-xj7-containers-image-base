# Variante "run": openjdk-21-jre (JRE), sem javac/jmods/javadoc/demos —
# sem compilador. Compile em java21-dev.yaml (estágio de build) e copie o
# JAR/classes para esta imagem no estágio final.
include: distroless/image-base.yaml
contents:
  packages:
    - openjdk-21-jre

work-dir: /app

accounts:
  groups:
    - groupname: spring
      gid: 10000
  users:
    - username: spring
      uid: 10000
      gid: 10000
  run-as: spring

paths:
  - path: /app
    type: directory
    uid: 10000
    gid: 10000
    permissions: 0o755

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/jvm/java-21-openjdk/bin
